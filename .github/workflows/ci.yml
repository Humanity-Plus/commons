name: CI

on:
  pull_request:

jobs:
  plugin-manifests:
    name: Plugin manifests in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check plugin versions match package.json
        run: bun run check-plugin-version

      - name: Check plugin names match across manifests and docs
        run: bun run check-plugin-names

  skill-tests:
    name: Skill tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Run review-pr tests
        working-directory: skills/code-reviews/skills/review-pr
        run: bun test

  changeset:
    name: Changeset present for skill changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a changeset when skill content changes
        # The version PR ("chore: version plugins") consumes changesets by design.
        if: github.head_ref != 'changeset-release/main'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE" --quiet
          changed=$(git diff --name-only "origin/$BASE"...HEAD)
          skill_changes=$(echo "$changed" | grep '^skills/' | grep -v '/.claude-plugin/plugin.json$' || true)
          if [ -z "$skill_changes" ]; then
            echo "No skill content changed; no changeset required."
            exit 0
          fi
          changesets=$(echo "$changed" | grep '^\.changeset/.*\.md$' || true)
          if [ -z "$changesets" ]; then
            echo "::error::This PR changes skill content but has no changeset. Run \`bunx changeset\` and commit the result — or \`bunx changeset --empty\` if the change shouldn't appear in release notes."
            exit 1
          fi
          echo "Changeset found:"
          echo "$changesets"

  check:
    name: check
    if: always()
    needs: [plugin-manifests, skill-tests, changeset]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
