name: CI

on:
  pull_request:

jobs:
  check:
    name: Plugin versions in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check plugin versions match package.json
        run: bun run check-plugin-version
